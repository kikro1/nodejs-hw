<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f4f4f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #18181b;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="padding: 32px 0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="480"
            cellpadding="0"
            cellspacing="0"
            style="
              background-color: #ffffff;
              border-radius: 8px;
              padding: 32px;
            "
          >
            <tr>
              <td>
                <h1 style="font-size: 20px; margin: 0 0 16px">
                  Password reset
                </h1>
                <p style="font-size: 14px; line-height: 1.6; margin: 0 0 16px">
                  Hi {{username}},
                </p>
                <p style="font-size: 14px; line-height: 1.6; margin: 0 0 24px">
                  We received a request to reset the password for your
                  account. Click the button below to choose a new one. This
                  link is valid for 15 minutes.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{resetLink}}"
                    style="
                      display: inline-block;
                      background-color: #18181b;
                      color: #ffffff;
                      text-decoration: none;
                      padding: 12px 24px;
                      border-radius: 6px;
                      font-size: 14px;
                    "
                    >Reset password</a
                  >
                </p>
                <p style="font-size: 12px; line-height: 1.6; color: #71717a">
                  If you didn't request a password reset, you can safely
                  ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
